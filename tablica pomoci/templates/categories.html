{% extends "base.html" %}

{% block content %}
<h1>Список категорий</h1>
<a href="{{ url_for('add_category') }}" class="btn btn-primary">Добавить категорию</a>

<ul class="list-group mt-3">
    {% for category in categories %}
    <li class="list-group-item">{{ category.name }}</li>
    {% endfor %}
</ul>
{% endblock %}
